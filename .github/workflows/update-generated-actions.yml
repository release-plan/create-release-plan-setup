name: Update generated workflow actions

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit generated action references
        run: node scripts/update-generated-actions.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create update pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.ACTIONS_UPDATE_TOKEN || github.token }}
          branch: update-generated-action-pins
          commit-message: Update generated workflow action pins
          title: Update generated workflow action pins
          body: Updates generated workflows to the latest stable action tags, pinned to their commit SHAs.
          add-paths: |
            plan-release-template.yml.ejs
            publish-template.yml.ejs
